services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kitepkura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitepkura"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PORT: 2000
    ports:
      - "2000:2000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BACKEND: http://localhost:2000
        NEXT_PUBLIC_API_URL: http://localhost:2000/api
        API_INTERNAL_URL: http://backend:2000/api
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BACKEND: http://localhost:2000
      NEXT_PUBLIC_API_URL: http://localhost:2000/api
      API_INTERNAL_URL: http://backend:2000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
