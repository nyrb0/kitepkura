services:
  certbot:
    image: certbot/certbot
    container_name: certbot

    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kitepkura

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

  backend:
    build: ./backend

    container_name: backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 2000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/kitepkura?schema=public

    depends_on:
      - postgres

    expose:
      - "2000"

    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: frontend

    restart: unless-stopped

    environment:
      API_INTERNAL_URL: http://backend:2000/api
      NEXT_PUBLIC_BACKEND_URL: https://api.kitepkura.edu.kg
      NEXT_PUBLIC_API_URL: https://api.kitepkura.edu.kg/api

    depends_on:
      - backend

    expose:
      - "3000"

volumes:
  postgres_data:
  backend_uploads:
