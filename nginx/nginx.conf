events {}

http {

    # HTTP -> HTTPS + Let's Encrypt challenge
    server {
        listen 80;
        server_name test.kitepkura.edu.kg;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    server {
        listen 80;
        server_name api.kitepkura.edu.kg;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # Frontend HTTPS
    server {
        listen 443 ssl;
        server_name test.kitepkura.edu.kg;

        ssl_certificate /etc/letsencrypt/live/test.kitepkura.edu.kg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.kitepkura.edu.kg/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }


    # Backend HTTPS
    server {
        listen 443 ssl;
        server_name api.kitepkura.edu.kg;

        ssl_certificate /etc/letsencrypt/live/api.kitepkura.edu.kg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kitepkura.edu.kg/privkey.pem;

        location / {
            proxy_pass http://backend:2000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}